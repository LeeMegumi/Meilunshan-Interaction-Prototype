<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美崙山互動流程原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&family=Huninn&family=Fredoka:wght@600;700&display=swap">
<style>
/* 16:9 舞台等比縮放置中；介面為暫時樣式，正式介面另行設計 */
:root{--bg:#191713;--paper:#fbf6ea;--ink:#2a251e;--muted:#6c6355;--accent:#3d7a3a;--warn:#a8461f;
 --display:"Noto Serif TC","Songti TC",serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 --round:"Huninn","Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--game:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--num:"Fredoka","Noto Sans TC",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0e0c}}
:root[data-theme="dark"]{--bg:#0f0e0c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--ink)}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#e9e1cb;user-select:none;-webkit-user-select:none;touch-action:none}
#wall{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.an{transform-box:view-box}
.actor{cursor:pointer}
#day,#night,.bgi{transition:opacity 2s ease}
.bgi{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;pointer-events:none}
.fxp{transform-box:fill-box;transform-origin:center}
.lay{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;will-change:transform,opacity;display:block}
.dfx,.nfx{transition:opacity 2s ease}
.sway,.sway2{transform-box:view-box}
#veil{background:#141c48}
#vig{background:radial-gradient(ellipse at 45% 50%,rgba(42,29,14,0) 55%,rgba(42,29,14,.3) 100%)}

.ui{position:absolute;background:var(--paper);border-radius:999px;box-shadow:0 5px 0 rgba(42,29,14,.22),0 10px 22px rgba(42,29,14,.2);font-size:28px;font-weight:500;color:var(--ink);border:0;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;padding:0 34px;height:84px}
.ui:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
/* 遊戲風按鈕：粗體字、白框、立體厚度；位置由版面 A／B／C 決定，都放在孩子碰得到的高度 */
.gbtn{font-family:var(--game);font-weight:900;border:6px solid #fff;color:#3a2a12;box-shadow:0 8px 0 rgba(42,29,14,.3),0 16px 26px rgba(42,29,14,.22);flex-direction:column;justify-content:center;gap:2px;padding:0 16px;height:auto;transition:transform .08s,box-shadow .08s}
.gbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(42,29,14,.3)}
.gbtn svg{width:70px;height:70px;flex:none}
.gbtn b{font-size:30px;line-height:1.1;white-space:nowrap}
#b-dn{padding:10px;gap:8px;background:#fbf6ea}
#b-dn i{font-style:normal;display:flex;flex-direction:column;align-items:center;width:128px;padding:8px 0 10px;border-radius:22px;font-size:25px;line-height:1.1;color:#7a6f5c;transition:background .3s,color .3s}
#b-dn i svg{width:58px;height:58px;opacity:.6;transition:opacity .3s}
#b-dn i.on svg{opacity:1}
#i-day.on{background:#ffe27a;color:#3a2a12}
#i-night.on{background:#2e3a66;color:#fff}
#b-find{background:linear-gradient(#ffe27a,#f6c544)}
#f-back{background:linear-gradient(#fff,#efe7d2)}
#f-back b{font-size:26px;color:#2f6233}
#hint{left:50%;top:30px;transform:translateX(-50%);cursor:default;font-family:var(--round);font-size:28px;height:70px;color:#3a2a12;pointer-events:none;border:5px solid #fff;padding:0 34px 0 22px}
.tap{width:44px;height:44px;color:#e8502a;flex:none}
.tap circle{transform-box:fill-box;transform-origin:center}
.tap .r1{animation:tapR 1.3s ease-out infinite}.tap .r2{animation:tapR 1.3s ease-out .25s infinite}
@keyframes tapR{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.25);opacity:0}}
/* 版面 C：下方兩側的大圓鈕，目標列是浮動膠囊、計時像徽章掛在左端 */
.lay-C #b-dn{left:34px;top:560px;border-radius:44px}
.lay-C #b-find{right:34px;top:650px;width:200px;height:200px;border-radius:50%}
.lay-C #f-back{left:34px;top:650px;width:200px;height:200px;border-radius:50%}
.lay-C #f-bar{left:50%;right:auto;top:16px;transform:translateX(-50%);width:max-content;height:128px;border-radius:999px;border:6px solid #fff;padding:0 34px 0 150px;gap:0}
.lay-C #f-chips{flex:none;gap:10px}.lay-C .chip{height:100px;width:164px}
.lay-C #f-timer{position:absolute;left:8px;top:5px}
#f-bar{position:absolute;left:0;right:0;top:0;height:132px;display:flex;align-items:center;gap:22px;padding:0 32px;background:linear-gradient(#fbf6ea,#f3ead6);box-shadow:0 6px 0 rgba(42,29,14,.18),0 14px 30px rgba(42,29,14,.18)}
#f-bar .ui{position:static;height:72px;font-family:var(--round);font-size:26px;flex:none}
#f-chips{flex:1;display:flex;gap:14px;justify-content:center}
.chip{width:172px;height:108px;border-radius:18px;border:3px dashed #b9ad97;background:#efe7d2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--round);font-size:20px;color:#8a8070;position:relative;transition:background .3s,border-color .3s}
.chip svg{width:92px;height:62px;filter:grayscale(1) brightness(.5) contrast(.7);opacity:.55;transition:filter .4s,opacity .4s}
.chip::after{content:'?';position:absolute;right:8px;top:4px;font-family:var(--display);font-size:24px;color:#b9ad97}
.chip.ok{border:3px solid var(--accent);background:#dcefd0;color:var(--ink);font-weight:700;animation:chipPop .7s cubic-bezier(.34,1.56,.64,1)}
.chip.ok svg{filter:none;opacity:1}
.chip.ok::after{content:'✓';color:#fff;background:var(--accent);width:34px;height:34px;border-radius:50%;right:-10px;top:-10px;font-size:22px;display:flex;align-items:center;justify-content:center;font-family:var(--body);box-shadow:0 3px 0 rgba(42,29,14,.25)}
.chip.miss{border-color:var(--warn);color:var(--warn)}
@keyframes chipPop{0%{transform:scale(.7) rotate(-6deg)}55%{transform:scale(1.22) rotate(4deg)}100%{transform:none}}
/* 遊戲字：粗黑體＋外框＋立體厚度，逐字微微歪斜並彈入 */
.gt{display:inline-flex;gap:.04em;font-family:var(--game);font-weight:900;line-height:1.15;white-space:nowrap}
.gt span{display:inline-block;transform:rotate(var(--r,0deg));animation:gtIn .55s cubic-bezier(.34,1.56,.64,1) backwards,gtBob 2.6s ease-in-out infinite}
@keyframes gtIn{from{transform:translateY(.5em) scale(.2) rotate(calc(var(--r,0deg)*-3));opacity:0}}
@keyframes gtBob{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(calc(var(--r,0deg)*-.6)) translateY(-.06em)}}
/* 倒數：圓環一圈圈縮短，秒數在中間（C 方案） */
#f-timer{flex:none;width:118px;height:118px;position:relative}
#f-timer svg{width:118px;height:118px;display:block;filter:drop-shadow(0 6px 0 rgba(42,29,14,.22))}
#f-ring{transition:stroke .3s}
.clk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.clk b{font-family:var(--num);font-weight:700;font-size:42px;line-height:.95;color:#3a2a12}
.clk small{font-family:var(--round);font-size:15px;line-height:1;color:#8a8070;letter-spacing:.1em}
.clk.tick b{animation:tick .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes tick{0%{transform:scale(1.22)}100%{transform:none}}
#f-timer.hurry{animation:shake .45s ease-in-out infinite}
#f-timer.hurry .clk b{color:#d2401e}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
#f-big{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);pointer-events:none}
#f-intro{position:absolute;inset:0;background:rgba(30,24,16,.6);display:flex;align-items:center;justify-content:center;cursor:pointer}
#f-intro .ip{background:var(--paper);border-radius:36px;padding:40px 64px 44px;width:1320px;text-align:center;box-shadow:0 10px 0 rgba(42,29,14,.25),0 30px 60px rgba(0,0,0,.35);animation:ipIn .55s cubic-bezier(.34,1.56,.64,1)}
#f-intro.out{transition:opacity .35s;opacity:0}
@keyframes ipIn{from{transform:scale(.8) translateY(40px);opacity:0}}
#f-intro h2{margin:0 0 6px;font-size:118px}
#f-intro .lead{font-family:var(--round);font-size:36px;margin:10px 0 26px;color:#5a4c38}
#f-targets{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tg{background:#efe7d2;border-radius:22px;padding:14px 8px 12px;font-family:var(--round);font-size:25px;border:4px solid #fff;box-shadow:0 5px 0 rgba(42,29,14,.14)}
.tg svg{width:100%;height:120px;display:block}
@keyframes tgIn{from{transform:translateY(30px) scale(.7);opacity:0}}
.how{list-style:none;display:flex;justify-content:center;gap:20px;padding:0;margin:28px 0 26px;counter-reset:h}
.how li{counter-increment:h;white-space:nowrap;font-family:var(--round);font-size:26px;background:#fff;border-radius:999px;padding:10px 30px 10px 12px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 0 rgba(42,29,14,.14)}
.how li::before{content:counter(h);font-family:var(--num);font-size:30px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #24502a}
.how li b{font-family:var(--game);font-weight:900;color:#2f6233}
.how li:nth-child(2)::before{background:#e8a020;box-shadow:0 3px 0 #a86a10}.how li:nth-child(2) b{color:#a86a10}
.how li:nth-child(3)::before{background:#e8502a;box-shadow:0 3px 0 #9a2e12}.how li:nth-child(3) b{color:#b23a18}
.go{display:inline-block;font-family:var(--game);font-weight:900;font-size:44px;letter-spacing:.08em;margin:0;color:#3a2a12;background:linear-gradient(#ffe27a,#f6c544);padding:16px 64px;border-radius:999px;border:6px solid #fff;box-shadow:0 7px 0 #c4922a,0 14px 24px rgba(42,29,14,.25);animation:pulse 1.4s ease-in-out infinite}
.ftag{position:absolute;transform:translate(-50%,-100%);background:linear-gradient(#5aa646,#3d7a3a);color:#fff;font-family:var(--round);font-size:32px;padding:10px 32px 12px;border-radius:999px;border:5px solid #fff;white-space:nowrap;box-shadow:0 6px 0 #24502a,0 12px 20px rgba(42,29,14,.25);pointer-events:none;animation:tagPop .5s cubic-bezier(.34,1.56,.64,1)}
.ftag b{font-family:var(--game);font-weight:900;font-size:42px;margin-left:12px;color:#ffe27a}
.ftag.fly{transition:left .55s cubic-bezier(.5,0,.8,.4),top .55s cubic-bezier(.3,0,.5,1),opacity .55s,transform .55s;opacity:.2;transform:translate(-50%,-50%) scale(.35)}
@keyframes tagPop{from{transform:translate(-50%,-60%) scale(.3);opacity:0}}
#curtain{position:absolute;left:0;top:0;width:1920px;height:1080px}
#cur-title{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);pointer-events:none}
.cl{transform-box:view-box}
.rb{display:flex;gap:28px;justify-content:center}
.rb .ui{position:static;white-space:nowrap;font-family:var(--game);font-weight:900;color:#3a2a12;border:7px solid #fff;border-radius:999px;display:flex;align-items:center;gap:14px;justify-content:center;box-shadow:0 9px 0 rgba(42,29,14,.3),0 18px 30px rgba(42,29,14,.22);font-size:44px;height:108px;padding:0 44px;animation:rfade .5s ease both}
.rb .ui i{font-style:normal;display:grid;place-items:center;border-radius:50%;background:#fff;color:#7a5418;width:56px;height:56px;font-size:34px}
#r-again{background:linear-gradient(#ffe6a0,#f2c95a);animation-delay:1.35s}#r-wall{background:linear-gradient(#fffdf6,#efe6d2);animation-delay:1.42s}
/* 聲音開關（只在網頁版；展場不需要） */
#snd{position:fixed;right:10px;bottom:8px;z-index:9;font:500 13px var(--body);color:#c9bea8;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;cursor:pointer}
#snd:focus-visible{outline:2px solid #ffe27a;outline-offset:2px}
#home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(ellipse 62% 56% at 50% 47%,rgba(255,250,232,.86) 0,rgba(255,250,232,.6) 45%,rgba(255,250,232,0) 100%)}
.hbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:-20px}
.rib{font-family:var(--game);font-weight:900;font-size:40px;letter-spacing:.2em;color:#fff;background:linear-gradient(#5aa646,#3d7a3a);padding:8px 44px 10px;border-radius:999px;border:6px solid #fff;box-shadow:0 7px 0 #24502a;transform:rotate(-2deg);animation:ribIn .7s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes ribIn{from{transform:translateY(-60px) rotate(-12deg) scale(.5);opacity:0}}
#h-title{margin:0 0 34px}
.hsub{font-family:var(--round);font-size:40px;margin:0 0 26px;color:#4a3d2a;background:rgba(255,255,255,.7);padding:6px 34px;border-radius:999px}
.hgo{display:inline-flex;align-items:center;gap:16px;font-size:54px;padding:20px 72px 20px 48px}
.hgo .tap{width:66px;height:66px;color:#d2401e}
@keyframes pulse{50%{transform:scale(1.05)}}
.card{position:absolute;width:380px;background:var(--paper);border-radius:22px;border:5px solid #fff;box-shadow:0 7px 0 rgba(42,29,14,.25),0 16px 30px rgba(42,29,14,.25);overflow:hidden;transform-origin:0 50%;animation:cpop .45s cubic-bezier(.34,1.56,.64,1),cfade .12s linear;pointer-events:none}
.card.out{transition:opacity .45s,transform .45s;opacity:0;transform:scale(.88)}
/* 同 Unity：卡片由物種那一側橫向彈出 */
@keyframes cpop{from{transform:scaleX(.01)}}
@keyframes cfade{from{opacity:0}}
#links{pointer-events:none}
.card h3{margin:0;padding:12px 20px 10px;background:linear-gradient(#5aa646,#3d7a3a);color:#fff;font-family:var(--game);font-weight:900;font-size:32px;line-height:1.2;letter-spacing:.04em}
.card h3 i{display:block;font-family:Georgia,serif;font-size:18px;font-weight:400;opacity:.9}
.card .cb{padding:10px 20px 14px;font-family:var(--round);font-size:20px;line-height:1.5;color:var(--muted)}
.card .cb b{color:var(--ink)}
.card small{font-size:15px}
/* 結算面板：方案 A 紙雕獎狀卡（同 Unity），位置自動避開虛線圈起來的物種 */
#result{position:absolute;left:0;top:0;width:1000px;padding:44px 60px 50px;border-radius:44px;background:linear-gradient(#fffaf0,#f6ecd6);box-shadow:0 12px 0 rgba(42,29,14,.22),0 30px 60px rgba(42,29,14,.32);border:8px solid #fff;display:flex;flex-direction:column;gap:26px;align-items:center;transform-origin:50% 50%}
#result::before{content:"";position:absolute;inset:14px;border-radius:32px;border:3px dashed #e1d3b2;pointer-events:none}
#result .leaf{position:absolute;width:150px;height:70px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#7fb067,#3d7a3a)}
#result .l1{left:-46px;top:-26px;transform:rotate(-24deg)}#result .l2{right:-40px;top:-18px;transform:rotate(206deg) scale(.8)}
#result .rt{display:flex;justify-content:center}
#result .cm{position:relative;display:flex;align-items:center;justify-content:center;font-size:44px;animation:cmIn .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.85s}
@keyframes cmIn{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
#result .cm em{font-style:normal;color:#ffe27a}
#result .rbn{position:relative;z-index:1;background:linear-gradient(#5fa04e,#3b7a35);color:#fff;font:900 1em var(--game);padding:.32em 1.1em .38em;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 6px 0 rgba(42,29,14,.22);text-shadow:0 3px 0 #24522a;white-space:nowrap}
#result .tail{position:relative;width:1.3em;height:1.3em;background:#2f6a2b;margin-top:.55em;z-index:0}
#result .tail.l{margin-right:-.5em;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
#result .tail.r{margin-left:-.5em;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
#result .sub{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--round);color:#8a7a62;font-size:28px;margin-top:-14px;animation:rfade .5s ease both;animation-delay:1s}
#result .sub .dc{width:34px;height:34px;border-radius:50%;border:4px dashed #b8875a;flex:none}
@keyframes rfade{from{opacity:0;transform:translateY(14px)}}
#result .stamps{display:flex;gap:16px;justify-content:center}
#result .st{position:relative;width:132px;height:126px;border-radius:20px;background:#efe6d0;display:grid;place-items:center;animation:stIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes stIn{from{opacity:0;transform:scale(.6)}}
#result .st svg{width:100%;height:100%;display:block}
#result .st.no svg{filter:grayscale(1) brightness(1.05) opacity(.42)}
#result .st.no{background:#ece4d2;outline:4px dashed #c9b893;outline-offset:-6px}
#result .st .ck{position:absolute;right:-12px;top:-12px;width:46px;height:46px;border-radius:50%;background:#5aa646;border:5px solid #fff;color:#fff;font:900 26px var(--game);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#result .st .q{position:absolute;right:-10px;top:-12px;width:42px;height:42px;border-radius:50%;background:#fff;border:4px dashed #c9b893;color:#a08b62;font:900 24px var(--num);display:grid;place-items:center}
.mark text{font-family:var(--body);font-weight:700;font-size:26px;fill:#2a251e}
[hidden]{display:none!important}
#dbg{position:fixed;left:8px;bottom:6px;font-size:11px;color:#8a8070;font-family:ui-monospace,monospace;pointer-events:none}
</style></head><body>
<div id="fit">
 <img class="bgi" id="bg-day" alt=""><img class="bgi" id="bg-night" alt="" style="opacity:0"><img class="bgi" id="bg-find" alt="" hidden>
 <svg class="lay dfx wallonly" id="l-beam" viewBox="0 0 1920 1080"></svg><svg class="lay dfx" id="l-air" viewBox="0 0 1920 1080"></svg><svg class="lay wallonly" id="l-sway" viewBox="0 0 1920 1080"></svg>
 <svg id="wall" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
 <canvas class="lay" id="trail" width="1920" height="1080"></canvas>
 <svg class="lay wallonly" id="l-fg" viewBox="0 0 1920 1080"></svg><svg class="lay" id="l-fall" viewBox="0 0 1920 1080"></svg><div class="lay nfx" id="veil" style="opacity:0"></div><svg class="lay nfx" id="l-ff" viewBox="0 0 1920 1080" style="opacity:0"></svg><div class="lay" id="vig"></div>
 <button class="ui gbtn" id="b-dn" type="button" aria-label="切換日景與夜景"><i id="i-day" class="on"></i><i id="i-night"></i></button>
 <button class="ui gbtn" id="b-find" type="button"></button>
 <button class="ui gbtn" id="f-back" type="button" hidden></button>
 <div class="ui" id="hint"></div>
 <div id="f-bar" hidden><div id="f-chips"></div><div id="f-timer"><svg viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="57" fill="#fff"/><circle cx="62" cy="62" r="45" fill="none" stroke="#e2d8c4" stroke-width="13"/><circle id="f-ring" cx="62" cy="62" r="45" fill="none" stroke="#5aa646" stroke-width="13" stroke-linecap="round" transform="rotate(-90 62 62)" stroke-dasharray="282.7" stroke-dashoffset="0"/><circle cx="62" cy="62" r="35" fill="#fff8dc"/></svg><div class="clk" id="f-clk"><b id="f-time">60</b><small>秒</small></div></div></div>
 <div id="f-tags"></div>
 <div id="f-intro" hidden><div class="ip"><h2 id="f-h2"></h2><p class="lead">這些生物用保護色躲在森林裡，你找得到嗎？</p><div id="f-targets"></div><ol class="how"><li><b>仔細看</b>樹皮、落葉、石頭和樹叢</li><li><b>伸手碰</b>你發現的生物</li><li><b>60 秒</b>內找出全部 6 種</li></ol><p class="go">觸碰牆面開始</p></div></div>
 <div id="f-big"></div>
 <svg class="lay" id="links" viewBox="0 0 1920 1080"></svg>
 <div id="cards"></div>

const DEPTH={1:[1.6,.9,3.5,3.5],2:[3,1.4,7,6],3:[5,2,12,10],4:[10,3.5,22,18]};
const f=n=>(+n).toFixed(1);
function grad(id,c,vertical){
  const v=vertical?'x1="0" y1="0" x2="0" y2="1"':'x1=".1" y1="0" x2=".9" y2="1"';
  return `<linearGradient id="g-${id}" ${v}><stop offset="0" stop-color="${c[0]}"/><stop offset=".5" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient>`;
}
function paperFilter(n,dy,b1,dy2,b2,seed){
  const dx=dy*.55, dx2=dy2*.55;
  return `<filter id="p${n}" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="${seed}" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".1 .1 .1 0 .8  .1 .1 .1 0 .8  .1 .1 .1 0 .8  0 0 0 0 1" result="gn"/>
    <feComposite in="SourceGraphic" in2="gn" operator="arithmetic" k1="1" result="tex"/>
    <feComposite in="tex" in2="SourceGraphic" operator="in" result="texc"/>
    <feOffset in="SourceAlpha" dx="1.4" dy="1.7" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="rim"/>
    <feFlood flood-color="#fffdf5" flood-opacity=".75"/><feComposite in2="rim" operator="in"/>
    <feGaussianBlur stdDeviation=".35" result="hl"/>
    <feOffset in="SourceAlpha" dx="-1.1" dy="-1.3" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="rim2"/>
    <feFlood flood-color="#1a1208" flood-opacity=".22"/><feComposite in2="rim2" operator="in" result="sd"/>
    <feMerge result="lit"><feMergeNode in="texc"/><feMergeNode in="hl"/><feMergeNode in="sd"/></feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="${b1}"/><feOffset dx="${dx}" dy="${dy}" result="s1a"/>
    <feFlood flood-color="#2a1d0e" flood-opacity=".38"/><feComposite in2="s1a" operator="in" result="s1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="${b2}"/><feOffset dx="${dx2}" dy="${dy2}" result="s2a"/>
    <feFlood flood-color="#2a1d0e" flood-opacity=".2"/><feComposite in2="s2a" operator="in" result="s2"/>
    <feMerge><feMergeNode in="s2"/><feMergeNode in="s1"/><feMergeNode in="lit"/></feMerge>
  </filter>`;
}
function sharedDefs(){
  let d='';
  for(const k in PAL) d+=grad(k,PAL[k],k==='sky'||k==='water'||k==='soil');
  for(const n in DEPTH) d+=paperFilter(n,...DEPTH[n],2+n*2);
  d+=`<radialGradient id="rvg"><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <radialGradient id="sun" cx=".18" cy=".12" r=".6"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".45" cy=".5" r=".75"><stop offset=".6" stop-color="#2a1d0e" stop-opacity="0"/><stop offset="1" stop-color="#2a1d0e" stop-opacity=".28"/></radialGradient>`;
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${d}</defs></svg>`;
}
// ---- 形狀工具 ----
function blade(x,y,len,w,ang,round=.35){
  const r=ang*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  const P=(u,v)=>f(x+u*c-v*s)+' '+f(y+u*s+v*c);
  return `M${P(0,0)} C${P(len*.22,-w)} ${P(len*(1-round*.4),-w*.9)} ${P(len,0)} C${P(len*(1-round*.4),w*.9)} ${P(len*.22,w)} ${P(0,0)}Z`;
}
function rib(x,y,len,ang){
  const r=ang*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  return `M${f(x+len*.08*c)} ${f(y+len*.08*s)} L${f(x+len*.88*c)} ${f(y+len*.88*s)}`;
}
function seg(x1,y1,x2,y2,w1,w2){ // 錐形肢段（含圓頭）
  const a=Math.atan2(y2-y1,x2-x1), nx=-Math.sin(a), ny=Math.cos(a), ux=Math.cos(a), uy=Math.sin(a);
  const h1=w1/2,h2=w2/2;
  return `M${f(x1+nx*h1)} ${f(y1+ny*h1)} L${f(x2+nx*h2)} ${f(y2+ny*h2)} C${f(x2+nx*h2+ux*h2*1.3)} ${f(y2+ny*h2+uy*h2*1.3)} ${f(x2-nx*h2+ux*h2*1.3)} ${f(y2-ny*h2+uy*h2*1.3)} ${f(x2-nx*h2)} ${f(y2-ny*h2)} L${f(x1-nx*h1)} ${f(y1-ny*h1)} C${f(x1-nx*h1-ux*h1*1.3)} ${f(y1-ny*h1-uy*h1*1.3)} ${f(x1+nx*h1-ux*h1*1.3)} ${f(y1+ny*h1-uy*h1*1.3)} ${f(x1+nx*h1)} ${f(y1+ny*h1)}Z`;
}
function ell(cx,cy,rx,ry){const k=.5523;return `M${f(cx-rx)} ${f(cy)} C${f(cx-rx)} ${f(cy-ry*k)} ${f(cx-rx*k)} ${f(cy-ry)} ${f(cx)} ${f(cy-ry)} C${f(cx+rx*k)} ${f(cy-ry)} ${f(cx+rx)} ${f(cy-ry*k)} ${f(cx+rx)} ${f(cy)} C${f(cx+rx)} ${f(cy+ry*k)} ${f(cx+rx*k)} ${f(cy+ry)} ${f(cx)} ${f(cy+ry)} C${f(cx-rx*k)} ${f(cy+ry)} ${f(cx-rx)} ${f(cy+ry*k)} ${f(cx-rx)} ${f(cy)}Z`;}
const circ=(cx,cy,r)=>ell(cx,cy,r,r);
const mx=d=>d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g,(m,x,y)=>f(800-x)+' '+y); // 以 x=400 左右鏡射
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
// ---- 紙層 ----
let MASK='rv';
const part=(d,k)=>`<path d="${d}" fill="url(#g-${k})"/>`;
const L=(n,inner)=>`<g filter="url(#p${n})">${inner}</g>`;
const bg=(d,k)=>`<path d="${d}" fill="url(#g-${k})"/>`;
const ink=(d,w=1.3,op=.75,col='#2a2724')=>`<path d="${d}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none" opacity="${op}"/>`;
const shaft=(x,y,l,a,op=.28)=>`<path d="${rib(x,y,l,a)}" stroke="#fff" stroke-opacity="${op}" stroke-width=".9" fill="none"/>`;
const gloss=(d,op=.22)=>`<path d="${d}" fill="#fff" opacity="${op}"/>`;
const eye=(x,y,r,k='black')=>L(2,part(circ(x,y,r),k))+`<circle cx="${x}" cy="${y}" r="${f(r*.55)}" fill="#0d0d0d"/><circle cx="${f(x-r*.32)}" cy="${f(y-r*.32)}" r="${f(Math.max(1.6,r*.3))}" fill="#fff"/>`;

const SKY=`<rect width="800" height="600" fill="url(#g-sky)"/><rect width="800" height="600" fill="url(#sun)"/>`;

function farCanopy(){
  let c='';[[30,70,62],[100,40,48],[150,96,40],[210,58,52],[268,26,38],[40,150,36],[570,20,42],[630,58,56],[700,22,50],[760,80,58],[690,120,34],[800,150,44]].forEach(([x,y,r])=>c+=`<circle cx="${x}" cy="${y}" r="${r}"/>`);
  return L(1,`<g fill="url(#g-far)">${c}</g>`);
}
function sideLeaves(){
  const A=[[-20,260,170,46,-25],[10,330,190,50,-12],[-10,420,170,46,4],[820,180,180,48,195],[830,260,200,52,182],[810,350,170,44,170]];
  return L(2,A.map(a=>bg(blade(...a),'mid')+`<path d="${rib(a[0],a[1],a[2],a[4])}" stroke="#e9f2d4" stroke-opacity=".45" stroke-width="1.6" fill="none"/>`).join(''));
}
function fgLeaves(){
  return L(4,bg(blade(-40,610,230,58,-52),'near')+bg(blade(-30,520,170,44,-18),'near')+`<path d="${rib(-40,610,230,-52)}" stroke="#d9ecc2" stroke-opacity=".4" stroke-width="2" fill="none"/>`)
       + L(4,bg(blade(840,-20,220,54,140),'near')+`<path d="${rib(840,-20,220,140)}" stroke="#d9ecc2" stroke-opacity=".4" stroke-width="2" fill="none"/>`);
}
function backBranch(){
  let farLeaves='';[[40,610,140,30,-96],[120,620,110,26,-70],[230,612,90,22,-104],[560,616,100,24,-78],[650,612,150,32,-100],[760,620,120,28,-66]].forEach(a=>farLeaves+=bg(blade(...a),'far'));
  const branch='M-20 462 C 140 448, 300 474, 455 466 C 610 458, 700 444, 820 448 L 820 486 C 700 484, 610 500, 455 504 C 300 512, 140 488, -20 500 Z';
  const strip='M10 474 C 150 464, 290 488, 450 480 C 590 474, 690 462, 800 464 L 800 472 C 690 472, 590 484, 450 490 C 290 498, 150 474, 10 484 Z';
  const twig='M610 458 C 640 420, 670 395, 720 372 L 726 382 C 682 404, 652 428, 626 462 Z';
  const moss=[[180,462,26,9],[250,468,20,7],[540,460,24,8],[95,456,18,7]].map(([x,y,rx,ry])=>bg(ell(x,y,rx,ry),'moss')).join('');
  return SKY+farCanopy()+L(1,farLeaves)+sideLeaves()
    +L(3,bg(twig,'bark'))+L(3,bg(blade(722,376,95,24,-30),'near')+bg(blade(700,388,85,22,30),'mid')+bg(blade(668,410,70,18,-60),'near'))
    +L(3,bg(branch,'bark'))+L(1,bg(strip,'barkhi')+bg(ell(300,488,16,7),'bark')+`<ellipse cx="300" cy="488" rx="8" ry="3" fill="#3a2716"/>`)+L(1,moss);
}
function backHang(){
  const br='M-20 64 C 200 54, 500 84, 820 60 L 820 96 C 500 120, 200 92, -20 100 Z';
  let lv='';[[60,96,110,28,100],[140,90,96,24,70],[230,92,120,30,108],[560,100,110,28,74],[640,94,124,30,104],[730,86,100,26,80],[300,96,80,20,60],[500,102,84,22,120]].forEach(a=>lv+=bg(blade(...a),'near'));
  let figs='';[[180,112],[196,120],[610,118],[626,110],[700,112]].forEach(([x,y])=>figs+=bg(circ(x,y,9),'berry'));
  return SKY+farCanopy()+sideLeaves()+L(3,bg(br,'bark'))+L(1,bg('M0 74 C 200 66, 500 92, 800 70 L 800 78 C 500 100, 200 76, 0 84 Z','barkhi'))+L(2,lv)+L(1,figs);
}
function backTrunk(sap){
  const trunk='M230 -10 C 250 200, 210 420, 240 610 L 600 610 C 570 420, 610 200, 580 -10 Z';
  let strips='';for(let i=0;i<8;i++){const x=252+i*42,w=i%2?12:18;strips+=bg(`M${x} -10 C ${x+12} 150, ${x-12} 350, ${x+6} 610 L ${x+w+6} 610 C ${x+w-10} 350, ${x+w+14} 150, ${x+w} -10 Z`,i%2?'bark':'barkhi');}
  const moss=[[290,560,40,14],[540,120,30,12],[560,470,26,10]].map(([x,y,rx,ry])=>bg(ell(x,y,rx,ry),'moss')).join('');
  return SKY+farCanopy()+sideLeaves()+L(3,bg(trunk,'bark'))+L(1,strips)+L(1,moss)
    +(sap?L(2,bg(ell(560,210,20,32),'sap')+gloss(ell(554,200,6,12),.45)):'');
}
function murrayaFlower(cx,cy,s=1){
  let p='';for(let i=0;i<5;i++)p+=bg(blade(cx,cy,22*s,8.5*s,-90+i*72,.9),'petal');
  return L(1,p)+bg(circ(cx,cy,4.5*s),'stamen');
}
function backFlower(){
  const R=rng(11);let lv='',lv2='';
  for(let i=0;i<34;i++){const x=R()*820-10,y=440+R()*170,a=-160+R()*140;const s=bg(blade(x,y,50+R()*30,15+R()*6,a,.9),i%2?'murleaf':'near');if(i%3)lv+=s;else lv2+=s;}
  let fl='';[[150,452],[178,470],[160,488],[610,446],[636,462],[620,482],[400,520],[426,536],[380,546],[700,520],[90,540]].forEach(([x,y])=>fl+=murrayaFlower(x,y,.9));
  return SKY+farCanopy()+sideLeaves()+L(2,lv2)+L(3,lv)+fl;
}
function backGround(){
  let trunks='';[[70,40],[170,30],[640,46],[740,34]].forEach(([x,w])=>trunks+=bg(`M${x} -10 L ${x+w} -10 L ${x+w+6} 430 L ${x-6} 430 Z`,'far'));
  const ground='M-10 410 C 200 392, 600 424, 810 402 L 810 610 L -10 610 Z';

  for(let i=0;i<46;i++){const x=R()*820-10,y=420+R()*190;lit+=bg(blade(x,y,40+R()*30,13+R()*6,R()*360,.7),ks[i%3]);}
  return SKY+L(1,trunks)+sideLeaves()+L(3,bg(ground,'soil'))+L(1,lit);
}
function backCave(){
  const R=rng(17);
  const roof='M-20 -20 L 820 -20 L 820 120 C 760 130, 700 104, 640 118 C 560 136, 500 108, 430 112 C 360 116, 300 140, 230 126 C 150 110, 80 136, -20 122 Z';
  let spots='';for(let i=0;i<26;i++){spots+=bg(ell(R()*800,R()*110,8+R()*22,5+R()*10),i%2?'stone':'cave');}

// ===== 12 種物種繪製（骨架版）=====
// 關節規則：子部件包在父部件裡一起動；每個關節兩側都以圓頭收在同一個樞紐點，轉動時輪廓不斷開
const A=(cls,ox,oy,inner)=>`<g class="an ${cls}" style="transform-origin:${ox}px ${oy}px">${inner}</g>`;
const J=(name,px,py,inner,style='',attr='')=>`<g class="an j-${name}" style="transform-origin:${f(px)}px ${f(py)}px;${style}" ${attr}>${inner}</g>`;
// 眼瞼：預設收起，眨眼時由上往下蓋
const lid=(x,y,r,k)=>J('lid',x,y-r*1.1,L(1,part(circ(x,y,r*1.12),k)),'transform:scaleY(0.001)');
// 節鏈：pts 為各關節點，子節包在父節內
function chain(prefix,pts,ws,k,depth=2,extra=()=>''){
  let inner='';
  for(let i=pts.length-2;i>=0;i--){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const sh=part(seg(x1,y1,x2,y2,ws[i],ws[i+1]),k);inner=J(prefix+i,x1,y1,(depth?L(depth,sh):sh)+extra(i,x1,y1,x2,y2)+inner);
  }
  return inner;
}
// 兩節肢（股節＋脛節，跗節固定在脛節上）；IK 也用這份資料
const LEGS={};
function limb(def,k,depth=2,tip=''){
  const {n,C,K,T,F,w}=def;
  const tib=part(seg(K[0],K[1],T[0],T[1],w[1],w[2]),k)+((T[0]!==F[0]||T[1]!==F[1])?part(seg(T[0],T[1],F[0],F[1],w[2],w[3]),k):'')+tip;
  return L(depth,J(n+'a',C[0],C[1],part(seg(C[0],C[1],K[0],K[1],w[0],w[1]),k)+J(n+'b',K[0],K[1],tib)));
}
const mirP=p=>[800-p[0],p[1]];
function legPair(id,prefix,list,k,depth=2,tipFn=null){
  LEGS[id]=LEGS[id]||[];let s='';
  list.forEach((d,i)=>{
    const L_={n:`${prefix}L${i}`,C:d[0],K:d[1],T:d[2],F:d[3],w:d[4]};
    const R_={n:`${prefix}R${i}`,C:mirP(d[0]),K:mirP(d[1]),T:mirP(d[2]),F:mirP(d[3]),w:d[4]};
    LEGS[id].push(L_,R_);
    s+=limb(L_,k,depth,tipFn?tipFn(L_.F):'')+limb(R_,k,depth,tipFn?tipFn(R_.F):'');
  });
  return s;
}

const tp=(d,cx,cy,s,ang=0)=>{const r=ang*Math.PI/180,c=Math.cos(r),n=Math.sin(r);
  return d.replace(/(-?\d*\.?\d+)\s+(-?\d*\.?\d+)/g,(m,x,y)=>{x=+x;y=+y;return f(cx+(x*c-y*n)*s)+' '+f(cy+(x*n+y*c)*s);});};
const limbChain=(pts,ws,k)=>{let s='';for(let i=0;i<pts.length-1;i++)s+=part(seg(...pts[i],...pts[i+1],ws[i],ws[i+1]),k);return s;};

// ===== 美崙山紙雕動態語言（骨架版）=====
const EASE={
  out:'cubic-bezier(0.22, 1, 0.36, 1)',
  in:'cubic-bezier(0.64, 0, 0.78, 0)',
  pop:'cubic-bezier(0.34, 1.56, 0.64, 1)',
  sine:'cubic-bezier(0.37, 0, 0.63, 1)',
};
const jitter=(v,p=.15)=>v*(1+(Math.random()*2-1)*p);
const $$=(r,sel)=>[...r.querySelectorAll(sel)];

// 關鍵格：[時間ms, transform, 到下一格的曲線, 其他屬性]
function animEl(el,pts,{delay=0,iter=1,composite='add'}={}){
  const total=pts[pts.length-1][0];
  const frames=pts.map(([t,tr,e,extra])=>Object.assign({offset:total?t/total:0,transform:tr||'none',easing:e||EASE.sine},extra||{}));
  return el.animate(frames,{duration:total,delay,iterations:iter,composite,fill:'none'});
}
const track=(r,sel,pts,o={})=>$$(r,sel).map(el=>animEl(el,pts,o));
// 單向環境循環 0→峰→0
function loop(r,sel,peak,period,phase=null){
  const d=jitter(period);
  return track(r,sel,[[0,'none'],[d/2,peak],[d,'none']],{iter:Infinity}).map(a=>{a.currentTime=(phase??Math.random())*d;return a;});
}
// 每個元素依 data-p 錯開相位（風吹過葉叢、毛束起伏）
function loopEach(r,sel,peak,period){
  const d=jitter(period);
  return $$(r,sel).map(el=>{const a=animEl(el,[[0,'none'],[d/2,peak],[d,'none']],{iter:Infinity});a.currentTime=(1-(+el.dataset.p||0))*d;return a;});
}
// 節鏈波動：雙向擺動，越往末端幅度越大、相位越晚
function chainWave(r,prefix,n,amp,period,lag){
  const d=jitter(period),base=Math.random()*d,out=[];
  for(let i=0;i<n;i++){const a=amp*(.45+.55*i/(n-1||1));
    $$(r,'.j-'+prefix+i).forEach(el=>{const x=animEl(el,[[0,'none'],[d*.25,`rotate(${a}deg)`],[d*.75,`rotate(${-a}deg)`],[d,'none']],{iter:Infinity});x.currentTime=((base-i*lag)%d+d)%d;out.push(x);});}
  return out;
}
// 節鏈單次：每節延遲 lag 起動
function chainHit(r,prefix,n,ptsFn,lag){const out=[];for(let i=0;i<n;i++)out.push(...track(r,'.j-'+prefix+i,ptsFn(i,n),{delay:i*lag}));return out;}
function flaps(n,ms,closed,start=0){
  const p=[[start,'none',EASE.out]];
  for(let i=0;i<n;i++){p.push([start+i*ms+ms*.45,closed,EASE.out]);p.push([start+(i+1)*ms,'none',EASE.out]);}
  return p;
}
// 眨眼（眼瞼預設收起，用 replace 疊加）
function blink(r,twice=Math.random()<.2){
  const p=[[0,'scaleY(0.001)',EASE.in],[70,'scaleY(1)',EASE.out],[150,'scaleY(0.001)']];
  if(twice)p.push([260,'scaleY(0.001)',EASE.in],[330,'scaleY(1)',EASE.out],[410,'scaleY(0.001)']);
  return track(r,'.j-lid',p,{composite:'replace'});
}

// ---- 兩節 IK：身體移動時讓腳掌留在原地 ----
function ikSolve(C,K,F,Ft){
  const L1=Math.hypot(K[0]-C[0],K[1]-C[1]),L2=Math.hypot(F[0]-K[0],F[1]-K[1]);
  const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
  const a1o=ang(C,K),relo=ang(K,F)-a1o;
  const cr=(F[0]-C[0])*(K[1]-C[1])-(F[1]-C[1])*(K[0]-C[0]),sg=cr>=0?1:-1;
  let D=Math.hypot(Ft[0]-C[0],Ft[1]-C[1]);D=Math.min(L1+L2-.01,Math.max(Math.abs(L1-L2)+.01,D));
  const al=Math.acos(Math.min(1,Math.max(-1,(L1*L1+D*D-L2*L2)/(2*L1*D))));
  const a1=ang(C,Ft)+sg*al,Kn=[C[0]+L1*Math.cos(a1),C[1]+L1*Math.sin(a1)],rel=ang(Kn,Ft)-a1;
  const nrm=x=>{while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return x*180/Math.PI;};
  return [nrm(a1-a1o),nrm(rel-relo)];
}
// keys: [時間, {dx,dy,s}, 曲線]；body 以 o 為原點縮放位移，腳依 IK 反算
function ikBody(r,id,bodySel,o,keys,opt={}){
  const tf=k=>`translate(${k.dx||0}px,${k.dy||0}px) scale(${k.s||1})`;
  const out=[...track(r,bodySel,keys.map(([t,k,e])=>[t,tf(k),e]),opt)];
  (LEGS[id]||[]).forEach(leg=>{
    const ang=keys.map(([t,k,e])=>{const s=k.s||1,Ft=[o[0]+(leg.F[0]-(k.dx||0)-o[0])/s,o[1]+(leg.F[1]-(k.dy||0)-o[1])/s];return [t,ikSolve(leg.C,leg.K,leg.F,Ft),e];});
    out.push(...track(r,'.j-'+leg.n+'a',ang.map(([t,a,e])=>[t,`rotate(${a[0].toFixed(2)}deg)`,e]),opt));
    out.push(...track(r,'.j-'+leg.n+'b',ang.map(([t,a,e])=>[t,`rotate(${a[1].toFixed(2)}deg)`,e]),opt));
  });
  return out;
}
// 抬一隻腳（落腳點會稍微移動，像在調整站姿）
function legStep(r,id,which=null){
  const legs=LEGS[id]||[];if(!legs.length)return [];
  const leg=which||legs[Math.floor(Math.random()*legs.length)],sg=leg.F[0]<400?1:-1;
  return [...track(r,'.j-'+leg.n+'a',[[0,'none',EASE.out],[180,`rotate(${-7*sg}deg)`,EASE.sine],[420,'none']]),
          ...track(r,'.j-'+leg.n+'b',[[0,'none',EASE.out],[180,`rotate(${10*sg}deg)`,EASE.sine],[420,'none']])];
}

const Director={
  actors:[],active:0,enabled:true,
  cap(){return Math.max(1,Math.floor(this.actors.filter(a=>a.visible).length/3));},
  add(a){this.actors.push(a);this.schedule(a);if(a.root.querySelector('.j-lid'))this.blinker(a);},
  blinker(a){setTimeout(()=>{if(this.enabled&&a.visible&&a.busy!=='touch')blink(a.root);this.blinker(a);},2500+Math.random()*3500);},
  schedule(a){clearTimeout(a.timer);a.timer=setTimeout(()=>this.tryBeat(a),3500+Math.random()*5500);},
  tryBeat(a){
    if(!this.enabled||!a.visible||a.colored===false||a.busy||this.active>=this.cap()){this.schedule(a);return;}
    const m=MOTION[a.id];this.run(a,[].concat(pick(m.beats)(a.root)),'beat');
  },
  run(a,anims,kind){
    const tok=a.tok=(a.tok||0)+1;
    a.busy=kind;if(kind==='beat')this.active++;a.onstate&&a.onstate();
    Promise.all(anims.map(x=>x.finished.catch(()=>{}))).then(()=>{if(kind==='beat')this.active--;if(a.tok!==tok)return;a.busy=null;a.onstate&&a.onstate();this.schedule(a);});
  },
  touch(a){
    if(a.busy==='touch')return false;
    if(a.busy==='beat')a.root.getAnimations({subtree:true}).filter(x=>x.effect.getComputedTiming().iterations!==Infinity).forEach(x=>x.cancel());
    this.run(a,[].concat(MOTION[a.id].touch(a.root)),'touch');return true;
  },
};

function flySamples(segs,step=34){
  const out=[];let t0=0,f=1,sx=1,prev=null;
  segs.forEach(sg=>{const n=Math.max(2,Math.round(sg.dur/step));
    for(let i=(out.length?1:0);i<=n;i++){const tt=i/n,u=(sg.warp||W_LIN)(tt),[x,y]=bezP(sg.p,u);
      let climb=0;if(prev){const dx=x-prev[0],dy=y-prev[1],sp=Math.hypot(dx,dy);if(sp>.6){if(!sg.face){if(dx<-.8)f=1;else if(dx>.8)f=-1;}climb=clampN(-dy/sp,-1,1)*26;}}
      if(sg.face)f=sg.face;sx+=clampN(f-sx,-.7,.7);if(Math.abs(sx)<.12)sx=.12*(f>0?1:-1);
      const bob=sg.bob?Math.sin((t0+tt*sg.dur)/55)*sg.bob:0;
      out.push({t:t0+tt*sg.dur,x,y:y+bob,rot:(sx>=0?1:-1)*(sg.pose(tt)+climb*(sg.tilt??1)),sx});prev=[x,y];}
    t0+=sg.dur;});
  return out;}
const flyAnim=(el,S,delay)=>animEl(el,S.map(s=>[s.t,`translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px) rotate(${s.rot.toFixed(1)}deg) scaleX(${s.sx.toFixed(2)})`,'linear']),{delay});
// 拍翅：t0–t1 之間以 period 上下拍，之後停在 hold 角度到 t2，再收回
function flapPts(t0,t1,period,up,down,hold,t2,ph=0){const p=[[0,'none',EASE.out]];if(t0>0)p.push([t0,'none',EASE.out]);
  let k=0;for(let t=t0+ph+period/2;t<t1;t+=period/2,k++)p.push([t,`rotate(${k%2?down:up}deg)`,EASE.sine]);
  if(hold!=null){p.push([t1+80,`rotate(${hold}deg)`,EASE.sine],[t2,`rotate(${hold}deg)`,EASE.in]);p.push([t2+170,'rotate(6deg)',EASE.out],[t2+330,'none']);}
  else p.push([t1+170,'rotate(6deg)',EASE.out],[t1+330,'none']);
  return p;}
const fadePts=(el,pts,delay)=>el.animate(pts.map(([t,o])=>({offset:t/pts[pts.length-1][0],opacity:o})),{duration:pts[pts.length-1][0],delay,fill:'none'});
const lerpN=(a,b,u)=>a+(b-a)*clampN(u,0,1);

   ...track(r,'.j-fc-tail',[[0,'none',EASE.out],[170,'rotate(-6deg)',EASE.sine],[170+d1*.6,'rotate(12deg)',EASE.sine],[170+d1+90,'rotate(-22deg)',EASE.sine],[170+d1+360,'rotate(14deg)',EASE.sine],[t1,'rotate(6deg)',EASE.sine],[t2,'rotate(-16deg)',EASE.out],[t2+260,'rotate(9deg)',EASE.sine],[t2+560,'rotate(-4deg)',EASE.sine],[t2+860,'none']],{delay:f})];
  FC_NOTES.forEach(n=>out.push(...track(r,'.j-fc-body',[[0,'none',EASE.pop],[90,'scale(1.03,1.02)',EASE.sine],[n.d+50,'none']],{delay:n.t})));

   cd.forEach((r,i)=>{const C=[r[0],r[1]],K=[r[2],r[3]],F=[r[4],r[5]];o.push({a:'cr-lL'+i,b:'cr-dL'+i,C,K,F,g:i%2},{a:'cr-lR'+i,b:'cr-dR'+i,C:mir(C),K:mir(K),F:mir(F),g:1-i%2});});

function glow(cx,cy,r){let rays='';for(let i=0;i<14;i++){const a=i/14*6.283,a2=a+.11;rays+=`M${cx} ${cy} L ${f(cx+Math.cos(a)*r*2.2)} ${f(cy+Math.sin(a)*r*2.2)} L ${f(cx+Math.cos(a2)*r*2.2)} ${f(cy+Math.sin(a2)*r*2.2)} Z `;}
  const id='gl'+Math.random().toString(36).slice(2,7);$('#f-glow').insertAdjacentHTML('beforeend',`<g id="${id}"><circle class="fxp halo" cx="${cx}" cy="${cy}" r="${r}" fill="#fff7cf" opacity=".0"/><path class="fxp rays" d="${rays}" fill="#fff3b0"/></g>`);
  const el=document.getElementById(id);el.querySelector('.rays').animate([{transform:'scale(.15) rotate(0deg)',opacity:.95},{transform:'scale(1) rotate(28deg)',opacity:.75,offset:.5},{transform:'scale(1.25) rotate(55deg)',opacity:0}],{duration:1300,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'});
  el.querySelector('.halo').animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1.15)',opacity:.85,offset:.4},{transform:'scale(1)',opacity:.62}],{duration:700,easing:'ease-out',fill:'forwards'});}
function foundOne(a){a.found=true;a.colored=true;fN++;fLast=performance.now();const [cx,cy,r]=fcenter(a),rad=Math.max(r.w,r.h)*.75;
  Snd.play('found'+Math.max(1,Math.min(6,fN)));Snd.playVar('sfx_leaves_scatter',.5,.08);
  scatterCover(a.id);glow(cx,cy-30,rad);burst(cx,cy);setTimeout(()=>burst(cx+40,cy-50),140);setTimeout(()=>burst(cx-50,cy-30),260);
  a.el.style.filter='';a.el.style.opacity=1;$('#f-top').appendChild(a.el);growTo(a,1.5,-34);setTimeout(()=>{if(Director.touch(a))touchSnd(a,.5);},300);
  // 「找到了」標籤先在物種上方彈出，再飛到上排對應的格子
  const tag=document.createElement('div');tag.className='ftag';tag.innerHTML=`找到了！<b>${INFO[a.id][0]}</b>`;tag.style.left=Math.max(200,Math.min(1720,cx))+'px';tag.style.top=Math.max(230,cy-rad-40)+'px';$('#f-tags').appendChild(tag);
  const chip=$('#chip-'+a.id);setTimeout(()=>{const fr=$('#fit').getBoundingClientRect(),k=fr.width/1920,cr=chip.getBoundingClientRect();tag.classList.add('fly');tag.style.left=((cr.left+cr.width/2-fr.left)/k)+'px';tag.style.top=((cr.top+cr.height/2-fr.top)/k)+'px';
    setTimeout(()=>{tag.remove();chip.classList.add('ok');},560);},1150);
  if(fN===6)setTimeout(()=>finishFind(),2900);}
// 點到空的地方：一圈淡淡的波紋，讓人知道有碰到
function missFx(x,y){Snd.play('miss',.6,.08);const id='ms'+Math.random().toString(36).slice(2,7);$('#f-fx').insertAdjacentHTML('beforeend',`<circle id="${id}" class="fxp" cx="${x}" cy="${y}" r="46" fill="none" stroke="#fffaf0" stroke-width="7" opacity=".0"/>`);
  const el=document.getElementById(id);el.animate([{transform:'scale(.3)',opacity:.85},{transform:'scale(1.25)',opacity:0}],{duration:520,easing:'ease-out',fill:'forwards'});setTimeout(()=>el.remove(),560);}
function mark(a,ok){const [cx,cy,r]=fcenter(a),rad=Math.max(r.w,r.h)*.7,ly=cy+rad+8>1020?cy-rad-64:cy+rad+8;$('#f-marks').insertAdjacentHTML('beforeend',`<g class="mark"><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#fff" stroke-width="10"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="#a8461f" stroke-width="5" stroke-dasharray="16 11"/><rect x="${cx-130}" y="${ly}" width="260" height="52" rx="26" fill="#fbf6ea"/><text x="${cx}" y="${ly+36}" text-anchor="middle">${INFO[a.id][0]}</text></g>`);
  $('#chip-'+a.id).classList.add('miss');}
function tickFind(){if(fPhase!=='play')return;const left=Math.max(0,fEnd-performance.now()),s=Math.ceil(left/1000);const rg=$('#f-ring');rg.setAttribute('stroke-dashoffset',282.7*(1-Math.ceil(left/60000*60-.001)/60));rg.setAttribute('stroke',s<=10?'#e8502a':s<=30?'#e8a020':'#5aa646');const tm=$('#f-timer');tm.classList.toggle('hurry',s<=10);tm.classList.toggle('mid',s<=30&&s>10);
  if($('#f-time').textContent!=String(s)){$('#f-time').textContent=s;const c=$('#f-clk');c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick');
    if(s<=5&&s>0){bigText(String(s),{size:300,colors:['#fff'],line:'#d2401e',r:12,depth:14,tilt:4},620);Snd.play('count');}
    else if(s<=10&&s>5)Snd.play('tick',.6);}
  if(performance.now()-fLast>20000){fLast=performance.now();const un=FIND.map(fAct).filter(a=>!a.found);if(un.length){const a=un[Math.floor(Math.random()*un.length)];a.el.animate([{opacity:a.el.style.opacity},{opacity:1,filter:'saturate(1) brightness(1.08)'},{opacity:a.el.style.opacity}],{duration:1600});a.colored=true;Director.touch(a);Snd.play('hint',.7);setTimeout(()=>{if(!a.found)a.colored=false;},3600);}}
  if(left<=0)finishFind();}
let fAuto=null;
function finishFind(){if(state!=='find'||fPhase!=='play')return;fPhase='done';clearInterval(fT);fT=null;
  FIND.map(fAct).filter(a=>!a.found).forEach(a=>{a.el.style.filter='';a.el.style.opacity=1;scatterCover(a.id);$('#f-top').appendChild(a.el);growTo(a,1.3,-20);setTimeout(()=>mark(a,false),620);});
  bigText(fN===6?'全部找到！':'時間到！',{size:210,colors:fN===6?['#ffd95a','#fff']:['#fff'],line:fN===6?'#2f6233':'#d2401e',r:11,depth:14,tilt:6},1200);Snd.play(fN===6?'allfound':'timeup');
  setTimeout(showResult,1650);
  clearTimeout(fAuto);fAuto=setTimeout(()=>{if(state==='find'&&fPhase==='done')transition(()=>goWall(),'觀察牆');},12000);}
// ---- 結算面板（方案 A：紙雕獎狀卡，同 Unity）----
const RPOOL={6:['你的眼睛真[厲害]！','一個都[沒漏掉]，太強了！','[保護色]都騙不了你！','你就是[森林小偵探]！','美崙山的[觀察高手]就是你！'],
 hi:['[差一點點]就全部找到了！','好眼力！再一次就能[全部找到]！','好厲害，只剩[一點點]了！','快要[滿分]了，再挑戰一次！'],
 mid:['牠們[躲得真好]，再試一次吧！','[保護色]很厲害對不對？','慢慢看，牠們就在[附近]喔！','已經[有收穫]了，繼續加油！'],
 lo:['森林裡的生物都[很會躲]喔！','換個地方找找看，[下次一定行]！','仔細看[樹皮、落葉]和石頭縫！','再來一次，你一定[找得到]！']};
const FTOP={x:300,y:0,w:1330,h:196};
function showResult(){if(state!=='find'||fPhase!=='done')return;Snd.play('result',.8);
  const R=$('#result'),all=fN===6,tier=all?6:fN>=4?'hi':fN>=1?'mid':'lo',line=RPOOL[tier][Math.floor(Math.random()*RPOOL[tier].length)];
  gameText($('#r-n'),all?'全部找到了！':`找到 ${fN} / 6 種`,{size:104,colors:all?['#ffd95a','#fff','#ff9a52']:['#fff'],line:'#2f6233',r:9,depth:11,tilt:4,step:.06,delay:.25});
  $('#r-cm').innerHTML=`<div class="cm"><span class="tail l"></span><span class="rbn">${line.replace(/\[([^\]]+)\]/g,'<em>$1</em>')}</span><span class="tail r"></span></div>`;
  $('#r-sub').innerHTML=all?'':'<div class="sub"><span class="dc"></span>虛線圈起來的是還沒找到的生物</div>';
  $('#r-st').innerHTML=fOrder.map((id,i)=>{const ok=fAct(id).found;return `<div class="st ${ok?'':'no'}" style="animation-delay:${(1.1+i*.08).toFixed(2)}s">${mini(id)}${ok?'<span class="ck">✓</span>':'<span class="q">?</span>'}</div>`;}).join('');
  R.style.transform='none';R.hidden=false;const w=R.offsetWidth,h=R.offsetHeight;
  // 挑面板的位置與大小：盡量不蓋住虛線圈起來的物種（其次是已找到的），也不擋上排與按鈕
  const ov=(a,b)=>{const x=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),y=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);return x>0&&y>0?x*y:0;};
  const un=[],fd=[];FIND.map(fAct).forEach(a=>{const b=arect(a),rad=Math.max(b.w,b.h)*.7+30,cx=b.x+b.w/2,cy=b.y+b.h/2,r={x:cx-rad,y:cy-rad-70,w:rad*2,h:rad*2+140};(a.found?fd:un).push(r);});
  let best=1e18,C=[960,560],k=1;
  for(const sc of [1,.92,.84,.76,.68,.62]){const pw=(w+30)*sc,ph=(h+40)*sc;
    for(let cy=200+ph/2;cy<=1072-ph/2+.1;cy+=24)for(let cx=10+pw/2;cx<=1910-pw/2+.1;cx+=32){const r={x:cx-pw/2,y:cy-ph/2,w:pw,h:ph};
      let c=ov(r,FTOP)*30+ov(r,FUIZ)*30;un.forEach(u=>c+=ov(r,u)*10);fd.forEach(u=>c+=ov(r,u)*1.2);c+=Math.abs(cx-960)*12+Math.abs(cy-600)*8+(1-sc)*200000;
      if(c<best){best=c;C=[cx,cy];k=sc;}}}
  R.style.left=(C[0]-w/2)+'px';R.style.top=(C[1]-h/2)+'px';
  R.animate([{transform:`scale(${(k*.85).toFixed(3)})`,opacity:0},{opacity:1,offset:.25},{transform:`scale(${k.toFixed(3)})`,opacity:1}],{duration:450,easing:'cubic-bezier(.34,1.56,.64,1)'});R.style.transform=`scale(${k.toFixed(3)})`;}
function endFind(){clearInterval(fT);fT=null;clearTimeout(fAuto);fPhase='';$('#result').hidden=true;$('#f-intro').hidden=true;$('#f-big').innerHTML='';$('#f-tags').innerHTML='';}
// ---- 事件 ----
$('#home').addEventListener('pointerdown',()=>goWall());
$('#b-dn').addEventListener('click',()=>{if(state!=='wall'||inTrans)return;touched();setNight(!night);});
$('#b-find').addEventListener('click',()=>{if(state!=='wall'||inTrans)return;Snd.play('btn');startFind();});
$('#f-back').addEventListener('click',()=>{if(inTrans)return;Snd.play('btn');transition(()=>{endFind();goWall();},'觀察牆');});
$('#r-wall').addEventListener('click',()=>{if(inTrans)return;Snd.play('btn');transition(()=>{endFind();goWall();},'觀察牆');});
$('#r-again').addEventListener('click',()=>{if(inTrans)return;Snd.play('btn');endFind();startFind();});
$('#f-intro').addEventListener('pointerdown',()=>beginFind());
svg.addEventListener('pointerdown',e=>{if(state==='find'&&fPhase==='play'&&!e.target.closest('.actor')){const p=stagePt(e);missFx(p.x,p.y);}});
document.addEventListener('pointerdown',e=>{touched();if(e.target.id!=='snd')Snd.unlock();},true);
// 聲音開關（網頁版才有）
$('#snd').addEventListener('click',e=>{e.stopPropagation();Snd.unlock();Snd.setOn(!Snd.on);$('#snd').textContent='聲音：'+(Snd.on?'開':'關');$('#snd').setAttribute('aria-pressed',String(Snd.on));});
$('#snd').addEventListener('pointerdown',e=>e.stopPropagation());
Snd.preload();
// ---- 滑過畫面的小粒子（同 Unity）：手按著牆面移動時，每隔 20–46 像素掉一顆，不浮誇、帶隨機性 ----
const TR={pts:new Map(),parts:[],cv:$('#trail'),lastSnd:0,raf:0};TR.ctx=TR.cv.getContext('2d');
const TRCOL=['255,247,214','255,217,107','204,237,158','255,255,255','255,189,133'];
function trSpawn(x,y){const a=Math.random()*6.283,sp=12+Math.random()*46,bl=TR.parts.length%3===0;
  TR.parts.push({x:x+(Math.random()-.5)*18,y:y+(Math.random()-.5)*18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-26,age:0,life:.45+Math.random()*.55,size:(bl?14:6)+Math.random()*(bl?12:8),rot:Math.random()*360,spin:(Math.random()-.5)*260,bl,col:TRCOL[Math.floor(Math.random()*TRCOL.length)]});
  if(TR.parts.length>140)TR.parts.shift();if(!TR.raf)TR.raf=requestAnimationFrame(trDraw);}
let trLast=0;
function trDraw(now){const dt=Math.min(.1,trLast?(now-trLast)/1000:.016);trLast=now;const c=TR.ctx;c.clearRect(0,0,1920,1080);
  TR.parts=TR.parts.filter(p=>{p.age+=dt;const k=p.age/p.life;if(k>=1)return false;p.vx*=1-1.6*dt;p.vy=p.vy*(1-1.6*dt)-14*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;
    const s=p.size*(k<.2?.5+2.5*k:1-.5*(k-.2)/.8);c.save();c.translate(p.x,p.y);c.rotate(p.rot*Math.PI/180);c.fillStyle=`rgba(${p.col},${(.85*(1-k*k)).toFixed(3)})`;c.beginPath();
    if(p.bl){c.moveTo(-s/2,0);c.quadraticCurveTo(0,-s*.32,s/2,0);c.quadraticCurveTo(0,s*.32,-s/2,0);}else c.arc(0,0,s/2,0,6.283);c.fill();c.restore();return true;});
  if(TR.parts.length)TR.raf=requestAnimationFrame(trDraw);else{TR.raf=0;trLast=0;}}
const fitPt=e=>{const r=$('#fit').getBoundingClientRect(),k=r.width/1920;return [(e.clientX-r.left)/k,(e.clientY-r.top)/k];};
$('#fit').addEventListener('pointerdown',e=>{const [x,y]=fitPt(e);TR.pts.set(e.pointerId,{x,y,acc:0,next:26,t:performance.now()});},true);
$('#fit').addEventListener('pointermove',e=>{if(!(e.buttons&1)&&e.pointerType==='mouse')return;const pt=TR.pts.get(e.pointerId),[x,y]=fitPt(e),now=performance.now();touched();
  if(!pt||now-pt.t>250||Math.hypot(x-pt.x,y-pt.y)>260){TR.pts.set(e.pointerId,{x,y,acc:0,next:26,t:now});return;}
  const d=Math.hypot(x-pt.x,y-pt.y);pt.t=now;if(d<.5)return;pt.acc+=d;
  while(pt.acc>=pt.next){pt.acc-=pt.next;pt.next=20+Math.random()*26;const f=pt.acc/Math.max(d,.001),qx=x-(x-pt.x)*f,qy=y-(y-pt.y)*f;trSpawn(qx,qy);if(Math.random()<.22)trSpawn(qx,qy);
    if(now-TR.lastSnd>140&&Math.random()<.6){TR.lastSnd=now;Snd.playAny('trail',5,.22,.03);}}
  pt.x=x;pt.y=y;});
['pointerup','pointercancel'].forEach(t=>$('#fit').addEventListener(t,e=>TR.pts.delete(e.pointerId)));
const IDLE=60000;setInterval(()=>{if(state!=='home'&&performance.now()-lastTouch>IDLE)goHome();
  $('#dbg').textContent=state==='home'?'':'無人觸碰 '+Math.floor((performance.now()-lastTouch)/1000)+' / 60 秒後回首頁';},500);
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),f=$('#fit');f.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`;}
addEventListener('resize',fit);fit();
setLayout('C');
if(matchMedia('(prefers-reduced-motion: reduce)').matches)Director.enabled=false;
goHome();
</script>
